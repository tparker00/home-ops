---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flate
        uses: home-operations/flate/action@bf3405a189626478b0aa6ec98dc4d6f7d419df17 # v0.4.12

      - name: Run Flate
        id: flate
        # NOTE: path points at the fork's Flux cluster root (matches the
        # previous flux-local --path).
        run: flate test all -p ./kubernetes/flux

      - name: Diff Manifests
        id: diff
        run: |
          flate diff all --allow-missing-secrets --skip-schema-validation -p ./kubernetes/flux --output diff > diff_output.txt || true

      - if: ${{ hashFiles('diff_output.txt') != '' }}
        name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://Kubernetes/github-jeeves/GITHUB_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://Kubernetes/github-jeeves/GITHUB_APP_PRIVATE_KEY

      - if: ${{ hashFiles('diff_output.txt') != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - if: ${{ hashFiles('diff_output.txt') != '' }}
        name: Prepare Comment
        run: |
          {
            echo "### Manifest Diff"
            echo ""
            echo '```diff'
            cat diff_output.txt
            echo '```'
          } > pr_comment.txt

      - if: ${{ hashFiles('pr_comment.txt') != '' }}
        name: Add PR Comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: ${{ github.event.pull_request.number }}/kubernetes/flux
          message-path: pr_comment.txt

  success:
    if: ${{ !cancelled() }}
    needs: [flate]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
