---
# grafana_reader credential generation (same pattern as lucidmate-db):
# ESO Password generator -> secret -> ALTER ROLE job applies it in Postgres.
# grafana_reader is the SELECT-only role Lucidmate migration 000010 creates.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: lucidmate-grafana-reader
spec:
  length: 40
  digits: 4
  symbols: 0 # alphanumeric only: embedded in Grafana secureJsonData
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lucidmate-grafana-datasource
spec:
  refreshInterval: 1h
  target:
    name: lucidmate-grafana-datasource
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        GRAFANA_DATASOURCE_USER: grafana_reader
        GRAFANA_DATASOURCE_PASS: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: lucidmate-grafana-reader
