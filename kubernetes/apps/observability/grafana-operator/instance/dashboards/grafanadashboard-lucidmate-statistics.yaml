perties":[{"id":"custom.width","value":90},{"id":"custom.align","value":"center"}]}]},"gridPos":{"h":12,"w":24,"x":0,"y":5},"id":7,"options":{"cellHeight":"sm","footer":{"countRows":false,"fields":"","reducer":[],"show":false},"showHeader":true,"sortBy":[{"desc":true,"displayName":"Month"}]},"targets":[{"datasource":{"type":"postgres","uid":"lucidmate"},"editorMode":"code","format":"table","rawQuery":true,"rawSql":"WITH months AS (\n  SELECT DISTINCT date_trunc('month', d)::date AS month\n  FROM (\n    SELECT ds.started_at AS d FROM drive_sessions ds WHERE ds.vehicle_id = '$vehicle'\n    UNION ALL\n    SELECT c.started_at FROM charging_sessions c WHERE c.vehicle_id = '$vehicle'\n    UNION ALL\n    SELECT t.recorded_at FROM telemetry t WHERE t.vehicle_id = '$vehicle'\n  ) activity\n)\nSELECT\n  to_char(m.month, 'YYYY-MM') AS \"Month\",\n  (\n    SELECT count(*)\n    FROM drive_sessions ds\n    WHERE ds.vehicle_id = '$vehicle'\n      AND date_trunc('month', ds.started_at) = m.month\n  )::int AS \"Drives\",\n  (\n    SELECT round(sum(CASE '$dist_unit' WHEN 'km' THEN dsv.end_odometer_km - dsv.start_odometer_km ELSE dsv.distance_mi END)::numeric, 1)\n    FROM drive_sessions_display dsv\n    WHERE dsv.vehicle_id = '$vehicle'\n      AND date_trunc('month', dsv.started_at) = m.month\n  ) AS \"Distance ($dist_unit)\",\n  (\n    SELECT count(*)\n    FROM charging_sessions c\n    WHERE c.vehicle_id = '$vehicle'\n      AND date_trunc('month', c.started_at) = m.month\n  )::int AS \"Charges\",\n  (\n    SELECT round(coalesce(sum(c.energy_added_kwh), 0)::numeric, 1)\n    FROM charging_sessions c\n    WHERE c.vehicle_id = '$vehicle'\n      AND date_trunc('month', c.started_at) = m.month\n  ) AS \"Energy (kWh)\",\n  (\n    SELECT round(avg(t.battery_level_pct)::numeric, 1)\n    FROM telemetry t\n    WHERE t.vehicle_id = '$vehicle'\n      AND t.battery_level_pct IS NOT NULL\n      AND date_trunc('month', t.recorded_at) = m.month\n  ) AS \"Avg Battery (%)\"\nFROM months m\nORDER BY m.