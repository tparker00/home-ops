    {"annotations":{"list":[{"builtIn":1,"datasource":{"type":"grafana","uid":"-- Grafana --"},"enable":true,"hide":true,"iconColor":"rgba(0, 211, 255, 1)","name":"Annotations & Alerts","type":"dashboard"}]},"description":"Approximate driving efficiency (Wh per km/mi) for one vehicle, derived by correlating battery_level_pct deltas from telemetry against odometer deltas from positions over the same windows, scaled by a pack-capacity lookup from vehicles.battery_pack_type. Approximate by design: Lucid exposes no instantaneous power draw, so every value is labeled approximate (issue #48).","editable":true,"fiscalYearStartMonth":0,"graphTooltip":1,"id":null,"links":[],"liveNow":false,"panels":[{"datasource":{"type":"postgres","uid":"lucidmate-pg"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"axisCenteredZero":false,"axisColorMode":"text","axisPlacement":"auto","barAlignment":0,"drawStyle":"line","fillOpacity":20,"gradientMode":"none","hideFrom":{"legend":false,"tooltip":false,"viz":false},"insertNulls":false,"lineInterpolation":"linear","lineWidth":2,"pointSize":5,"scaleDistribution":{"type":"linear"},"showPoints":"never","spanNulls":false,"stacking":{"group":"A","mode":"none"},"thresholdStyle":{"mode":"off"}},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null}]}},"overrides":[]},"gridPos":{"h":10,"w":18,"x":0,"y":0},"id":1,"options":{"legend":{"calcs":["mean","min","max"],"displayMode":"list","placement":"bottom","showLegend":true},"tooltip":{"hideZeros":false,"mode":"single","sort":"none"}},"targets":[{"datasource":{"type":"postgres","uid":"lucidmate-pg"},"editorMode":"code","format":"time_series","rawQuery":true,"rawSql":"WITH cap AS (\n  SELECT CASE v.battery_pack_type\n           WHEN 'AIR_22' THEN 118.0\n           WHEN 'AIR_18' THEN 112.0\n           WHEN 'AIR_16' THEN 88.0\n           ELSE NULL\n         END AS capacity_kwh\n  FROM vehicles v\n  WHERE v.id = '$vehicle'\n),\ntel AS (\n  SELECT $__timeGroup(recorded_at, '$__interval') AS bucket,\n         (max(battery_level_pct) - min(battery_level_pct)) AS pct_drop\n  FROM telemetry_display\n  WHERE vehicle_id = '$vehicle'\n    AND power_state = 'drive'\n    AND battery_level_pct IS NOT NULL\n    AND $__timeFilter(recorded_at)\n  GROUP BY 1\n),\npos AS (\n  SELECT $__timeGroup(recorded_at, '$__interval') AS bucket,\n         CASE '$dist_unit'\n           WHEN 'km' THEN max(odometer_km) - min(odometer_km)\n           ELSE max(odometer_mi) - min(odometer_mi)\n         END AS dist\n  FROM positions_display\n  WHERE vehicle_id = '$vehicle'\n    AND odometer_km IS NOT NULL\n    AND $__timeFilter(recorded_at)\n  GROUP BY 1\n)\nSELECT\n  tel.bucket AS \"time\",\n  CASE\n    WHEN pos.dist > 0.1 AND cap.capacity_kwh IS NOT NULL\n    THEN tel.pct_drop / 100.0 * cap.capacity_kwh * 1000.0 / pos.dist\n  END AS \"wh_per_$dist_unit\"\nFROM tel\nJOIN pos ON pos.bucket = tel.bucket\nCROSS JOIN cap\nORDER BY 1","refId":"A","sql":{"columns":[{"parameters":[],"type":"parameters"}],"groupBy":[{"property":{"type":"string"},"type":"groupBy"}],"limit":50}}],"title":"Efficiency while driving (Wh/$dist_unit, approximate)","type":"timeseries"},{"datasource":{"type":"postgres","uid":"lucidmate-pg"},"fieldConfig":{"defaults":{"color":{"fixedColor":"#7EB26D","mode":"fixed"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null}]}},"overrides":[]},"gridPos":{"h":10,"w":6,"x":18,"y":0},"id":2,"options":{"colorMode":"value","graphMode":"none","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showPercentChange":false,"textMode":"auto","wideLayout":true},"targets":[{"datasource":{"type":"postgres","uid":"lucidmate-pg"},"editorMode":"code","format":"table","rawQuery":true,"rawSql":"WITH cap AS (\n  SELECT CASE v.battery_pack_type\n           WHEN 'AIR_22' THEN 118.0\n           WHEN 'AIR_18' THEN 112.0\n           WHEN 'AIR_16' THEN 88.0\n           ELSE NULL\n         END AS capacity_kwh\n  FROM vehicles v\n  WHERE v.id = '$vehicle'\n),\nenergy AS (\n  SELECT COALESCE(sum(drop_pct), 0) AS pct_used FROM (\n    SELECT greatest(lag(battery_level_pct) OVER (ORDER BY recorded_at) - battery_level_pct, 0) AS drop_pct\n    FROM telemetry_display\n    WHERE vehicle_id = '$vehicle'\n      AND power_state = 'drive'\n      AND battery_level_pct IS NOT NULL\n      AND $__timeFilter(recorded_at)\n  ) e\n),\ndist AS (\n  SELECT COALESCE(sum(leg), 0) AS dist FROM (\n    SELECT greatest(CASE '$dist_unit'\n      WHEN 'km' THEN odometer_km - lag(odometer_km) OVER (ORDER BY recorded_at)\n      ELSE odometer_mi - lag(odometer_mi) OVER (ORDER BY recorded_at)\n    END, 0) AS leg\n    FROM positions_display\n    WHERE vehicle_id = '$vehicle'\n      AND odometer_km IS NOT NULL\n      AND $__timeFilter(recorded_at)\n  ) o\n)\nSELECT CASE\n  WHEN dist.dist > 0.1 AND cap.capacity_kwh IS NOT NULL\n  THEN energy.pct_used / 100.0 * cap.capacity_kwh * 1000.0 / dist.dist\nEND AS avg_wh_per_$dist_unit\nFROM cap, energy, dist","refId":"A","sql":{"columns":[{"parameters":[],"type":"parameters"}],"groupBy":[{"property":{"type":"string"},"type":"groupBy"}],"limit":50}}],"title":"Average efficiency (Wh/$dist_unit, approximate)","type":"stat"},{"gridPos":{"h":8,"w":24,"x":0,"y":10},"id":3,"options":{"content":"## Approximate — read this first\n\nLucid's APIs expose no instantaneous power draw (unlike Tesla's streaming API), so efficiency here is **necessarily approximate**. It is derived by correlating the battery percentage drop in `telemetry` against the odometer increase in `positions` over the same time window, then scaling by a nominal pack capacity looked up from `vehicles.battery_pack_type`.\n\nLimitations:\n\n- Battery percentage is a coarse, rounded signal: small changes per interval introduce noise, especially in short buckets.\n- Capacity lookup maps `AIR_22` → 118 kWh, `AIR_18` → 112 kWh, `AIR_16` → 88 kWh (nominal). Any other pack value yields **no data** rather than a guessed capacity.\n- Energy is only counted while `power_state = 'drive'`; distance is total distance in the window (a car only accrues odometer while driving, so this matches closely in practice).\n- Climate/preconditioning draw while parked and charging losses are excluded from the energy side, which can bias results optimistic.\n\nTreat the numbers as trends to compare drives and seasons, not as exact consumption.","mode":"markdown"},"title":"About this approximation","type":"text"}],"refresh":"5m","schemaVersion":39,"tags":["lucidmate","efficiency"],"templating":{"list":[{"current":{},"datasource":{"type":"postgres","uid":"lucidmate-pg"},"definition":"SELECT coalesce(nullif(nickname, ''), vin, lucid_vehicle_id) AS __text, id::text AS __value FROM vehicles WHERE is_active ORDER BY 1","hide":0,"includeAll":false,"label":"Vehicle","multi":false,"name":"vehicle","options":[],"query":"SELECT coalesce(nullif(nickname, ''), vin, lucid_vehicle_id) AS __text, id::text AS __value FROM vehicles WHERE is_active ORDER BY 1","refresh":1,"regex":"","skipUrlSync":false,"sort":0,"type":"query"},{"allValue":null,"current":{"selected":true,"text":"Metric","value":"metric"},"hide":0,"includeAll":false,"label":"Units","multi":false,"name":"unit_system","options":[{"selected":true,"text":"Metric","value":"metric"},{"selected":false,"text":"Imperial","value":"imperial"}],"query":"metric,imperial","queryValue":"","skipUrlSync":false,"type":"custom"},{"current":{},"datasource":{"type":"postgres","uid":"lucidmate-pg"},"definition":"SELECT CASE '$unit_system' WHEN 'metric' THEN 'km' ELSE 'mi' END AS unit","hide":2,"includeAll":false,"multi":false,"name":"dist_unit","options":[],"query":"SELECT CASE '$unit_system' WHEN 'metric' THEN 'km' ELSE 'mi' END AS unit","refresh":1,"regex":"","skipUrlSync":false,"sort":0,"type":"query"}]},"time":{"from":"now-7d","to":"now"},"timepicker":{},"timezone":"browser","title":"Lucidmate · Efficiency (approximate)","uid":"lucidmat