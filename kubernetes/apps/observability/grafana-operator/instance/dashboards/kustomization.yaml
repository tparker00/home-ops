---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard-data.yaml
  - ./grafanadashboard-flux.yaml
  - ./grafanadashboard-kubernetes.yaml
  - ./grafanadashboard-media.yaml
  - ./grafanadashboard-network.yaml
  - ./grafanadashboard-nginx.yaml
  - ./grafanadashboard-operator.yaml
  - ./grafanadashboard-speedtest.yaml
  - ./grafanadashboard-system.yaml
  - ./grafanadashboard-thanos.yaml
configMapGenerator:
  - name: media-dashboard
    files:
      - ./media/media.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  - ./grafanadashboard-lucidmate-battery-health.yaml
  - ./grafanadashboard-lucidmate-charging-history.yaml
  - ./grafanadashboard-lucidmate-drive-details.yaml
  - ./grafanadashboard-lucidmate-drive-stats.yaml
  - ./grafanadashboard-lucidmate-efficiency.yaml
  - ./grafanadashboard-lucidmate-freshness-watchdog.yaml
  - ./grafanadashboard-lucidmate-locations.yaml
  - ./grafanadashboard-lucidmate-polling-cadence.yaml
  - ./grafanadashboard-lucidmate-position-map.yaml
  - ./grafanadashboard-lucidmate-software-updates.yaml
  - ./grafanadashboard-lucidmate-state-breakdown.yaml
  - ./grafanadashboard-lucidmate-statistics.yaml
  - ./grafanadashboard-lucidmate-trip.yaml
  - ./grafanadashboard-lucidmate-trips.yaml
  - ./grafanadashboard-lucidmate-vampire-drain.yaml
  - ./grafanadashboard-lucidmate-vehicle-comparison.yaml
  - ./grafanadashboard-lucidmate-vehicle-overview.yaml
  - ./grafanadashboard-lucidmate-visited.yaml
