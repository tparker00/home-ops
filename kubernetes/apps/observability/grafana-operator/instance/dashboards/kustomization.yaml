---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard-data.yaml
  - ./grafanadashboard-flux.yaml
  - ./grafanadashboard-kubernetes.yaml
  - ./grafanadashboard-media.yaml
  - ./grafanadashboard-network.yaml
  - ./grafanadashboard-nginx.yaml
  - ./grafanadashboard-system.yaml
  - ./grafanadashboard-thanos.yaml
configMapGenerator:
  - name: media-dashboard
    files:
      - ./media/media.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
