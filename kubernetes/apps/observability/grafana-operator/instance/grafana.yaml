---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: &app grafana
  labels:
    dashboards: grafana
spec:
  # admin credentials are provided via GF_SECURITY_ADMIN_* env from grafana-secret
  disableDefaultAdminSecret: true
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      reporting_enabled: "false"
    date_formats:
      use_browser_locale: "true"
    explore:
      enabled: "true"
    feature_toggles:
      enable: publicDashboards
    plugins:
      allow_loading_unsigned_plugins: natel-discrete-panel,pr0ps-trackmap-panel
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    security:
      cookie_same_site: grafana
    server:
      root_url: https://grafana.${SECRET_DOMAIN}
    auth:
      signout_redirect_url: https://authentik.${SECRET_DOMAIN}/application/o/grafana-provider/end-session/
      oauth_auto_login: "false"
      oauth_allow_insecure_email_lookup: "true"
    auth.anonymous:
      enabled: "true"
      org_name: Main Org.
      org_role: Viewer
      hide_version: "true"
    auth.generic_oauth:
      name: authentik
      enabled: "true"
      scopes: openid email profile
      auth_url: https://authentik.${SECRET_DOMAIN}/application/o/authorize/
      token_url: https://authentik.${SECRET_DOMAIN}/application/o/token/
      api_url: https://authentik.${SECRET_DOMAIN}/application/o/userinfo/
      # Optionally map user groups to Grafana roles
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
  deployment:
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          initContainers:
            - name: init-db
              image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: &secret grafana-secret
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: *secret
                      key: adminUser
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: *secret
                      key: adminPass
              envFrom:
                - secretRef:
                    name: *secret
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app: *app
