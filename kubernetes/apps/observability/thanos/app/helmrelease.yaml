---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: thanos
      version: 17.3.1
      sourceRef:
        kind: HelmRepository
        name: bitnami

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: dragonfly-operator
      namespace: database
  valuesFrom:
    - targetPath: objstoreConfig.config.bucket
      kind: Secret
      name: thanos-secret
      valuesKey: BUCKET_NAME
    - targetPath: objstoreConfig.config.endpoint
      kind: Secret
      name: thanos-secret
      valuesKey: BUCKET_HOST
    - targetPath: objstoreConfig.config.region
      kind: Secret
      name: thanos-secret
      valuesKey: BUCKET_REGION
    - targetPath: objstoreConfig.config.access_key
      kind: Secret
      name: thanos-secret
      valuesKey: AWS_ACCESS_KEY_ID
    - targetPath: objstoreConfig.config.secret_key
      kind: Secret
      name: thanos-secret
      valuesKey: AWS_SECRET_ACCESS_KEY
  values:
    global:
      security:
        allowInsecureImages: true
    objstoreConfig:
      type: s3
      config:
        insecure: false
    queryFrontend:
      enabled: true
      replicaCount: 2
      # cilium netkit drops hairpinned ClusterIP flows (client and backend on the
      # same node): readiness roundtrips to the thanos-query VIP timed out 7/10
      # when a backend shared the node (2026-10-05). Keep the frontend off nodes
      # hosting its VIP backends (thanos-query) and its cache (thanos-dragonfly).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["thanos"]
                    - key: app.kubernetes.io/instance
                      operator: In
                      values: ["thanos"]
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["query"]
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: thanos-dragonfly
            # keep the two replicas spread (replaces the soft preset this override disables)
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: query-frontend
                    app.kubernetes.io/instance: thanos
                    app.kubernetes.io/name: thanos
      # ride out short VIP blips without dropping endpoints (default 6 = 60s)
      readinessProbe:
        failureThreshold: 12
      networkPolicy:
        extraIngress:
          # cilium+netkit drops hairpinned ClusterIP replies (same-node backend,
          # e.g. the thanos-dragonfly cache) as unsolicited; allow redis replies
          - from:
              - podSelector:
                  matchLabels:
                    app: thanos-dragonfly
                    app.kubernetes.io/name: dragonfly
                    app.kubernetes.io/part-of: dragonfly
      config: &config |-
        type: REDIS
        config:
          addr: "{{ .Release.Name }}-dragonfly:6379"
          db: 2
    query:
      enabled: true
      replicaCount: 2
      replicaLabel: ["__replica__"]
      dnsDiscovery:
        sidecarsService: kube-prometheus-stack-thanos-discovery
        sidecarsNamespace: observability
    bucketweb:
      enabled: true
      replicaCount: 2
      # bucket metadata sync spikes past 512Mi (OOMKilled 98s after start,
      # 2026-10-06); the chart-default 192Mi OOMKilled it every ~34min before
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
    compactor:
      enabled: true
      concurrency: 4
      extraFlags:
        - --delete-delay=30m
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
          ephemeral-storage: 10Gi
        limits:
          memory: 1Gi
          ephemeral-storage: 10Gi
      retentionResolutionRaw: 14d
      retentionResolution5m: 30d
      retentionResolution1h: 60d
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
    storegateway:
      enabled: true
      replicaCount: 2
      networkPolicy:
        extraIngress:
          # cilium+netkit drops hairpinned ClusterIP replies (same-node backend,
          # e.g. the thanos-dragonfly cache) as unsolicited; allow redis replies
          - from:
              - podSelector:
                  matchLabels:
                    app: thanos-dragonfly
                    app.kubernetes.io/name: dragonfly
                    app.kubernetes.io/part-of: dragonfly
      config: *config
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # was 768Gi (typo for 768Mi); storegateway runs ~1.8Gi so give it 4Gi
          memory: 4Gi
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
    ruler:
      enabled: true
      replicaCount: 2
      replicaLabel: __replica__
      alertmanagers: ["http://alertmanager-operated.observability.svc.cluster.local:9093"]
      extraFlags: ["--web.prefix-header=X-Forwarded-Prefix"]
      config: |-
        groups:
          - name: PrometheusWatcher
            rules:
              - alert: PrometheusDown
                annotations:
                  summary: A Prometheus has disappeared from Prometheus target discovery
                expr: absent(up{job="kube-prometheus-stack-prometheus"})
                for: 5m
                labels:
                  severity: critical
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
