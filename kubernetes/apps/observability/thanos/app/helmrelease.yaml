---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: thanos
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: thanos-community

  install:
    remediation:
      retries: 3
  upgrade:
    # one-time chart swap: the thanos-community chart changes the
    # storegateway/ruler StatefulSet selectors + volumeClaimTemplates and makes
    # thanos-storegateway headless, all immutable fields — force lets helm
    # replace them (PVCs are retained and re-adopted by name).
    # TODO: remove after the first successful reconcile.
    force: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: dragonfly-operator
      namespace: database
  values:
    global:
      objstore:
        # rendered by externalsecret.yaml (key: objstore.yml)
        createSecret: false
        secretName: thanos-secret
        secretKey: objstore.yml
      serviceMonitor:
        enabled: true
      # kept off: the chart's policies allow only service-port ingress with
      # no per-source control, which cannot express the dragonfly-reply
      # ingress the cilium+netkit hairpin workaround needed (the old
      # queryFrontend/storegateway networkPolicy.extraIngress)
      networkPolicies: false
      thanosRules:
        # bitnami deployed no PrometheusRule; keep this migration neutral
        enabled: false
      rbac:
        # nothing needs cluster RBAC (no ruler rule auto-import, no receive)
        create: false
    receive:
      enabled: false
    query:
      enabled: true
      replicaCount: 2
      replicaLabels:
        - __replica__
        # the chart hardcodes --label=ruler_replica on ruler pods
        - ruler_replica
      endpoints:
        static:
          # kube-prometheus-stack sidecars (was query.dnsDiscovery.sidecarsService)
          - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.observability.svc.cluster.local
    queryFrontend:
      enabled: true
      replicaCount: 2
      # cilium netkit drops hairpinned ClusterIP flows (client and backend on the
      # same node): readiness roundtrips to the thanos-query VIP timed out 7/10
      # when a backend shared the node (2026-10-05). Keep the frontend off nodes
      # hosting its VIP backends (thanos-query) and its cache (thanos-dragonfly).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["thanos"]
                    - key: app.kubernetes.io/instance
                      operator: In
                      values: ["thanos"]
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["query"]
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: thanos-dragonfly
            # keep the two replicas spread
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: query-frontend
                    app.kubernetes.io/instance: thanos
                    app.kubernetes.io/name: thanos
      # ride out short VIP blips without dropping endpoints (chart default 6 = 60s)
      probes:
        readiness:
          failureThreshold: 12
      # results cache on the shared dragonfly instance (tpl'd by the chart);
      # prefix keeps frontend keys apart from storegateway index keys in db 2
      cacheConfig: |
        type: REDIS
        config:
          addr: "{{ .Release.Name }}-dragonfly:6379"
          db: 2
          prefix: thanos-frontend:
    bucket:
      bucketweb:
        enabled: true
        replicaCount: 2
        # bucket metadata sync spikes past 512Mi (OOMKilled 98s after start,
        # 2026-10-06); the chart-default 192Mi OOMKilled it every ~34min before
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi
    compactor:
      enabled: true
      # chart defaults + the previous delete-delay/concurrency tuning
      extraArgs:
        - --log.level=info
        - --log.format=logfmt
        - --consistency-delay=30m
        - --delete-delay=30m
        - --compact.concurrency=4
      retention:
        resolutionRaw: 14d
        resolution5m: 30d
        resolution1h: 60d
      vpa:
        # no VPA CRD in this cluster
        enabled: false
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
          ephemeral-storage: 10Gi
        limits:
          memory: 1Gi
          ephemeral-storage: 10Gi
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        # 60Gi: cold re-scan working set post-migration + growth headroom
        size: 60Gi
    storegateway:
      enabled: true
      replicaCount: 2
      # REDIS index cache on dragonfly: the chart has no index-cache value, so
      # mount configmap-index-cache.yaml and pass the flag directly (same
      # config the bitnami chart rendered from storegateway.config)
      extraArgs:
        - --index-cache.config-file=/etc/thanos-index-cache/config.yml
      extraVolumes:
        - name: index-cache
          configMap:
            name: thanos-storegateway-index-cache
      extraVolumeMounts:
        - name: index-cache
          mountPath: /etc/thanos-index-cache/config.yml
          subPath: config.yml
          readOnly: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # was 768Gi (typo for 768Mi); storegateway runs ~1.8Gi so give it 4Gi
          memory: 4Gi
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
    ruler:
      enabled: true
      replicaCount: 2
      # bitnami deployed only the PrometheusWatcher rule: do not also import
      # every PrometheusRule CRD (chart default) — kube-prometheus-stack
      # already evaluates those itself
      autoImportPrometheusRules:
        enabled: false
      alertmanagers:
        config: |
          alertmanagers:
            - static_configs:
                - alertmanager-operated.observability.svc.cluster.local:9093
              scheme: http
              api_version: v2
      extraArgs:
        - --web.prefix-header=X-Forwarded-Prefix
      rules:
        # blank the chart's default example rule: the JSON schema makes this key
        # required, but an empty file loads as zero rule groups
        example-alerts.yaml: ""
        prometheus-watcher.yaml: |
          groups:
            - name: PrometheusWatcher
              rules:
                - alert: PrometheusDown
                  annotations:
                    summary: A Prometheus has disappeared from Prometheus target discovery
                  expr: absent(up{job="kube-prometheus-stack-prometheus"})
                  for: 5m
                  labels:
                    severity: critical
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
