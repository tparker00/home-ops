---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: &app speedtest-exporter
  labels: &labels
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      <<: *labels
  endpoints:
    - port: metrics
      interval: 60m
      scrapeTimeout: 2m  # exporter runs a full synchronous Ookla test per scrape (~40-60s); 1m timed out every scrape -> zero samples since 2026-10-04
      path: /metrics
