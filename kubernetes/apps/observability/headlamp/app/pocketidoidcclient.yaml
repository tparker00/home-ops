---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
spec:
  name: Headlamp
  callbackUrls:
    - "https://headlamp.${SECRET_DOMAIN}/auth/callback"
  # Chart consumes `headlamp-secret` via config.oidc.externalSecret;
  # keys renamed to the env names headlamp expects.
  secret:
    name: headlamp-secret
    keys:
      client_id: OIDC_CLIENT_ID
      client_secret: OIDC_CLIENT_SECRET
      issuer_url: OIDC_ISSUER_URL
