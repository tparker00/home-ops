---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mount-watchdog
  namespace: flux-system
  labels:
    # Opt out of the cluster-apps global patch (kubernetes/flux/apps.yaml,
    # target labelSelector "substitution.flux.home.arpa/disabled notin (true)")
    # which re-injects decryption + postBuild.substituteFrom into every child
    # ks. The watchdog script's $VARS are runtime container env (e.g. NODE),
    # not Flux substitutions — strict envsubst fails the build on them.
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/storage/mount-watchdog/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  # No postBuild on purpose: the embedded watchdog script's $VARS are runtime
  # container env (downward API), not Flux substitutions — strict envsubst
  # fails the build on them (post-merge failure of #2269). Nothing here uses
  # ${APP}; name/labels are literal. Do not re-add without $$-escaping the
  # whole script. The opt-out label in metadata.labels is what stops the
  # cluster-apps global patch from re-injecting postBuild (#2292 follow-up).
