---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name nominatim-pg-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # CNPG initdb requires `username` + `password` keys. The password
        # is generated in the lucidmate namespace (generator.yaml) and
        # pushed to Bitwarden key `nominatim-db` (pushsecret-db.yaml) —
        # same value the app consumes, so DSN and DB always agree.
        username: nominatim
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: nominatim-db
