---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/refs/heads/main/config/crd/bases/postgresql.cnpg.io_clusters.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nominatim
spec:
  instances: 1
  # Nominatim requires PostGIS (not present in the shared cluster's
  # vectorchord image). Single instance: one consumer (Lucidmate), and the
  # data is fully reproducible from public Geofabrik extracts — disaster
  # recovery is a re-import, not a barman restore.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgis
  imageName: ghcr.io/cloudnative-pg/postgis:16-3.4@sha256:bb5a8590a8c934767482e34e1d103253f412aec703b77bbc52ad9044bf6e56f9

  storage:
    size: 50Gi
    storageClass: openebs-hostpath

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 512MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all

  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"

  monitoring:
    enablePodMonitor: true

  # CNPG's initdb.secret only sets the role password ONCE, at first
  # bootstrap — it is never reconciled again on its own. managed.roles
  # makes CNPG continuously sync the role password from the secret on every
  # reconcile, so a later secret rotation (or any drift) self-heals instead
  # of silently leaving the role with a stale password (root cause of a
  # live auth failure: secret, ES, and generator all agreed on a value the
  # role itself had never been given).
  managed:
    roles:
      - name: nominatim
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: nominatim-pg-secret

  bootstrap:
    initdb:
      database: nominatim
      owner: nominatim
      secret:
        name: nominatim-pg-secret
      # `nominatim import` creates its own database via createdb (fails if
      # it exists, needs CREATEDB) and installs hstore/postgis/postgis_raster
      # — all untrusted extensions. Prerequisites are provisioned here so the
      # app role can bootstrap without superuser:
      #   postInitSQL — web role (checked by the import) + CREATEDB grant
      #   postInitTemplateSQL — extensions in template1, so every createdb
      #     (incl. Nominatim's own) inherits them; its CREATE EXTENSION IF NOT
      #     EXISTS then no-ops for any database owner.
      # Re-runs on every cluster rebuild; idempotent by construction.
      postInitSQL:
        - CREATE ROLE "www-data" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
        - ALTER ROLE nominatim CREATEDB;
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS hstore;
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS postgis_raster;
