---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-server
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts

  maxHistory: 2
  dependsOn: []
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    controllers:
      immich-server:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          enableServiceLinks: false
          nodeSelector:
                  feature.node.kubernetes.io/coral-tpu: "true"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: immich-server
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: immich-secret
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              # General
              LOG_LEVEL: verbose
              IMMICH_MEDIA_LOCATION: &mediaLocation /usr/src/app/upload
              # Ports
              IMMICH_PORT: &port 3001
              IMMICH_METRICS: true
              # REDIS
              REDIS_HOSTNAME: "immich-dragonfly"
              REDIS_PORT: 6379
            envFrom: *envFrom
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4096Mi

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /server-info/ping
                    port: 3001
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /server-info/ping
                    port: 3001
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 1

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      metrics:
        controller: *app
        ports:
          metrics:
            port: 8081
      microservices-metrics:
        controller: *app
        ports:
          microservices-metrics:
            port: 8082


    serviceMonitor:
      main:
        enabled: true
        serviceName: immich-server-metrics
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 20s
      micro-metrics:
        enabled: true
        serviceName: immich-server-microservices-metrics
        endpoints:
          - port: microservices-metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 20s
    route:
      app:
        hostnames:
          - "photos.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: app
                port: *port
        parentRefs:
          - name: envoy-external
            namespace: network
      analogpuddle:
        hostnames:
          - "photos.analogpuddle.com"
        rules:
          - backendRefs:
              - identifier: app
                port: *port
        parentRefs:
          - name: envoy-external-ap
            namespace: network

    persistence:
      library:
        type: persistentVolumeClaim
        existingClaim: immich-rw
        globalMounts:
          - path: *mediaLocation
      external:
        type: persistentVolumeClaim
        existingClaim: photos-rw
        globalMounts:
          - path: /data/external
