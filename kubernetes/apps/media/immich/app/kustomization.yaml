---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/instance: immich
      app.kubernetes.io/part-of: immich
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./server
  - ./machine-learning
components:
  - ../../../../components/dragonfly
patches:
  - path: dragonfly-patch.yaml
    target:
      kind: Dragonfly
      name: ".*-dragonfly"
