# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse
spec:
  # Password is generated once and must stay stable for the DB user; do not refresh.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: audiomuse-secret
    template:
      data:
        POSTGRES_USER: &dbuser audiomuse
        POSTGRES_PASSWORD: &dbpass "{{ .pg_pass }}"
        POSTGRES_DB: &dbname audiomusedb
        POSTGRES_HOST: &dbhost postgres-rw.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        REDIS_URL: "redis://audiomuse-dragonfly"
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .super_pg_pass }}"
  dataFrom:
  - extract:
      key: audiomuse
  - extract:
      key: cloudnative-pg
