---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lucidmate
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    global:
      # Private GHCR image; credentials templated from the Bitwarden `ghcr` secret.
      imagePullSecrets:
        - name: lucidmate-ghcr

    controllers:
      # Stateless HTTP API + SPA server. 2 replicas; each rollout runs
      # migrations first via the initContainer (golang-migrate holds a
      # Postgres advisory lock, so concurrent migrators are safe).
      api:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image:
              repository: ghcr.io/tparker00/lucidmate
              tag: 0.1.0
            command: ["/usr/local/bin/lucidmate-migrate"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-db
                    key: DATABASE_URL
        containers:
          app:
            image:
              repository: ghcr.io/tparker00/lucidmate
              tag: 0.1.0
            env:
              API_PORT: 8080
              AUTH_MODE: oidc
              COOKIE_SECURE: "true"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-db
                    key: DATABASE_URL
              LUCIDMATE_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-app
                    key: LUCIDMATE_ENCRYPTION_KEY
              OIDC_ISSUER_URL:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-app
                    key: OIDC_ISSUER_URL
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-app
                    key: OIDC_CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-app
                    key: OIDC_CLIENT_SECRET
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              runAsUser: 65532
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &apiPort 8080
                  periodSeconds: 20
                  timeoutSeconds: 2
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *apiPort
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

      # The only writer of vehicle telemetry. Exactly one replica: it holds
      # per-account gRPC sessions and the adaptive poll scheduler — two
      # pollers would double-poll and race the snapshot observers.
      poller:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image:
              repository: ghcr.io/tparker00/lucidmate
              tag: 0.1.0
            command: ["/usr/local/bin/lucidmate-migrate"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-db
                    key: DATABASE_URL
        containers:
          app:
            image:
              repository: ghcr.io/tparker00/lucidmate
              tag: 0.1.0
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-db
                    key: DATABASE_URL
              LUCIDMATE_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-app
                    key: LUCIDMATE_ENCRYPTION_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              runAsUser: 65532
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

      # One-shot: creates the lucidmate role + database on the shared CNPG
      # cluster with a randomly generated password, stored in the
      # lucidmate-db-generated Secret. A PushSecret then persists the password
      # to Bitwarden (bws-cache v0.2.0 write path) so nothing human-typed
      # ever holds database credentials.
      db-init:
        type: job
        job:
          backoffLimit: 3
        serviceAccount:
          name: lucidmate-db-init
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
        initContainers:
          psql:
            image:
              repository: postgres
              tag: "16"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                PW="$$(openssl rand -base64 32 | tr -d '\n')"
                printf '%s' "$$PW" > /work/pw
                export PGPASSWORD="$${SUPER_PG_PASS}"
                psql -h "$${PGHOST}" -U "$${PGUSER}" -v ON_ERROR_STOP=1 -v pw="$$PW" <<'SQL'
                SELECT format('CREATE ROLE lucidmate LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'lucidmate') \gexec
                SELECT 'CREATE DATABASE lucidmate OWNER lucidmate'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'lucidmate') \gexec
                ALTER ROLE lucidmate WITH LOGIN PASSWORD :'pw';
                SQL
            env:
              PGHOST:
                value: postgres-rw.database.svc.cluster.local
              PGUSER:
                value: postgres
              SUPER_PG_PASS:
                valueFrom:
                  secretKeyRef:
                    name: lucidmate-superuser
                    key: super_pg_pass
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          store:
            image:
              repository: ghcr.io/dtzar/helm-kubectl
              tag: 4.3.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                kubectl create secret generic lucidmate-db-generated \
                  --from-literal=password="$$(cat /work/pw)" \
                  --namespace lucidmate \
                  --dry-run=client -o yaml | kubectl apply -f -
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      api:
        controller: api
        ports:
          http:
            port: 8080

    persistence:
      db-init-work:
        type: emptyDir
        advancedMounts:
          db-init:
            psql:
              - path: /work
            store:
              - path: /work

    route:
      api:
        hostnames: ["lucidmate.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: lucidmate-api
                port: 8080
