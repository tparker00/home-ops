---
# Pulls the generated database password back out of Bitwarden and composes
# the full DATABASE_URL. The value lands in Bitwarden via pushsecret-db.yaml
# after the db-init job runs; until then this ExternalSecret stays NotReady
# and the api/poller pods wait on their secret refs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lucidmate-db
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://lucidmate:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/lucidmate"
  data:
    - secretKey: password
      remoteRef:
        key: lucidmate-db
