---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lucidmate-app
  annotations:
    # VERIFIED 2026-10-31: Bitwarden secret `lucidmate` exists with exactly
    # {encryption_key, oidc_issuer, oidc_client_id, oidc_client_secret}.
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        LUCIDMATE_ENCRYPTION_KEY: "{{ .encryption_key }}"
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: lucidmate
