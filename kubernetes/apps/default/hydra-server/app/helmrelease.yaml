---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hydra-server
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts

  dependsOn: []
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      hydra-server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: tparker20/hydra-server
              tag: latest@sha256:d15eec27a3e31c138373b40596e5971e43f280b35ade8ad3dde0e7792b3bfe53
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              IS_CUSTOM_SERVER: "true"
            envFrom:
              - secretRef:
                  name: hydra-secret
            resources:
              requests:
                cpu: 1000m
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        controller: *app
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
      analogpuddle:
        hostnames:
          - "{{ .Release.Name }}.analogpuddle.com"
        parentRefs:
          - name: envoy-external-ap
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /app/config
      data:
        enabled: true
        existingClaim: "{{ .Release.Name }}-data"
        globalMounts:
          - path: /data
