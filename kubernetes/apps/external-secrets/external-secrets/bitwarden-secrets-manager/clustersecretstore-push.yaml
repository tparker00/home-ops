---
# Cluster-wide push path into Bitwarden via the bws-cache write endpoint
# (POST /key, v0.2.0+). Mirrors the read store (clustersecretstore.yaml):
# same token, same service — this one carries write semantics, so anything
# creating a PushSecret cluster-wide can store generated credentials.
# Read traffic keeps using `bitwarden-secrets-manager`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secrets-manager-push
spec:
  # Write path is opt-in per namespace: only namespaces carrying this label
  # may use the store. Flip a namespace on by labeling it, not by editing
  # this store.
  conditions:
    - namespaceSelector:
        matchLabels:
          bws-push.home.arpa/allowed: "true"
  provider:
    webhook:
      # PushSecret push flow (context has remoteRef.secretKey) targets the
      # create-or-update /key endpoint; ESO's verify flow (updatePolicy:
      # IfNotExists; context has only remoteRef.key) targets the read-only
      # /exists endpoint (bws-cache v0.2.1+) — one store-wide POST method
      # serves both, so verification must never reach /key.
      url: "http://bws-cache.external-secrets.svc.cluster.local:8080{{ if .remoteRef.secretKey }}/key/{{ .remoteRef.remoteKey }}{{ else }}/exists/{{ .remoteRef.key }}{{ end }}"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .serviceaccount.token }}"
      body: '{{ if .remoteRef.secretKey }}{"value": "{{ index .remoteRef .remoteRef.remoteKey }}"}{{ else }}{}{{ end }}'
      secrets:
        - name: serviceaccount
          secretRef:
            name: bws-secret
            key: token
            namespace: external-secrets
