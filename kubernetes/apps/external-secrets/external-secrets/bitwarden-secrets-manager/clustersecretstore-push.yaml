---
# Cluster-wide push path into Bitwarden via the bws-cache write endpoint
# (POST /key, v0.2.0+). Mirrors the read store (clustersecretstore.yaml):
# same token, same service — this one carries write semantics, so anything
# creating a PushSecret cluster-wide can store generated credentials.
# Read traffic keeps using `bitwarden-secrets-manager`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secrets-manager-push
spec:
  # Write path is opt-in per namespace: only namespaces carrying this label
  # may use the store. Flip a namespace on by labeling it, not by editing
  # this store.
  conditions:
    - namespaceSelector:
        matchLabels:
          bws-push.home.arpa/allowed: "true"
  provider:
    webhook:
      url: "http://bws-cache.external-secrets.svc.cluster.local:8080/key/{{ .remoteRef.remoteKey }}"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .serviceaccount.token }}"
      body: '{"value": "{{ index .remoteRef .remoteRef.remoteKey }}"}'
      secrets:
        - name: serviceaccount
          secretRef:
            name: bws-secret
            key: token
