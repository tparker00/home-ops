---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns-coredns
spec:
  interval: 30m
  chart:
    spec:
      chart: coredns
      version: 1.50.7
      sourceRef:
        kind: HelmRepository
        name: coredns-coredns

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: coredns-coredns-helm-values
