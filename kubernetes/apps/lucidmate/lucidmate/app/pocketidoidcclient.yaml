---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: lucidmate
spec:
  name: Lucidmate
  callbackUrls:
    - "https://lucidmate.${SECRET_DOMAIN}/auth/callback"
  secret:
    keys:
      client_id: OIDC_CLIENT_ID
      client_secret: OIDC_CLIENT_SECRET
      issuer_url: OIDC_ISSUER_URL
