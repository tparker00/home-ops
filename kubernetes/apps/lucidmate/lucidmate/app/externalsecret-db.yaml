---
# Composes the postgres-init env and DATABASE_URL from the generated
# password (pushed to Bitwarden key `lucidmate-db` by pushsecret-db.yaml)
# plus the cluster superuser pass from the shared `cloudnative-pg` secret —
# the same shape sonarr/radarr/lidarr consume, sourced from a generated
# credential instead of a static one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lucidmate-db
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: lucidmate
        INIT_POSTGRES_USER: lucidmate
        INIT_POSTGRES_PASS: "{{ .password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .super_pg_pass }}"
        DATABASE_URL: "postgres://lucidmate:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/lucidmate"
  data:
    - secretKey: password
      remoteRef:
        key: lucidmate-db
  dataFrom:
    - extract:
        key: cloudnative-pg
