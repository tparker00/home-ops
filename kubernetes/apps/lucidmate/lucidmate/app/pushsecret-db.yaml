---
# Persists the db-init job's generated Postgres password into Bitwarden
# (key lucidmate-db, project Home) so the credential survives cluster
# rebuilds and is never human-typed.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: lucidmate-db
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: bitwarden-secrets-manager-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: lucidmate-db-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: lucidmate-db
