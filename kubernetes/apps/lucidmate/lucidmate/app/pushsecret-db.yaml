---
# Persists the db-init job's generated Postgres password into Bitwarden
# (key lucidmate-db, project Home) so the credential survives cluster
# rebuilds and is never human-typed.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: lucidmate-db
spec:
  # IfNotExists, NOT the Replace default: the upstream Password generator
  # regenerates a fresh value on every ES refresh (1h), and Replace pushed
  # that new value into Bitwarden hourly. The app's ExternalSecret (15m)
  # then handed long-lived pods a DATABASE_URL whose password the DB role
  # no longer matched until the next postgres-init pod start -- the same
  # churn that took down Nominatim auth on 2026-11-07 (see #2480). The
  # generator only needs to SEED the Bitwarden key once on a fresh store;
  # after that the key is the pin, and consumers read Bitwarden directly.
  updatePolicy: IfNotExists
  refreshInterval: 5m
  secretStoreRefs:
    - name: bitwarden-secrets-manager-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: lucidmate-db-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: lucidmate-db
