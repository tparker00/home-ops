---
# Push-capable store: POSTs secret values into Bitwarden through the
# bws-cache v0.2.0 write path (project Home, via BWS_CACHE_PROJECT_NAME).
# Read traffic keeps using the shared ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bws-push
spec:
  provider:
    webhook:
      url: "http://bws-cache.external-secrets.svc.cluster.local:8080/key/{{ .remoteRef.remoteKey }}"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer *** print .serviceaccount.token | quote }}"
      body: '{"value": "{{ index .remoteRef .remoteRef.remoteKey }}"}'
      secrets:
        - name: serviceaccount
          secretRef:
            name: bws-secret
            key: token
            namespace: external-secrets
