# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nominatim
  namespace: flux-system
spec:
  targetNamespace: lucidmate
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: nominatim-pg-cluster
    - name: cloudnative-pg-cluster
    - name: external-secrets-bitwarden
  path: ./kubernetes/apps/lucidmate/nominatim/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      MFS_CAPACITY: 10Gi
