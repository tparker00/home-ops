---
# Persists the generated Nominatim DB password into Bitwarden (key
# `nominatim-db`) so it survives cluster rebuilds. Push store + namespace
# label bws-push.home.arpa/allowed=true already present on `lucidmate`.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: nominatim-db
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: bitwarden-secrets-manager-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: nominatim-db-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: nominatim-db
