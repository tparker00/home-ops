---
# Persists the generated Nominatim DB password into Bitwarden (key
# `nominatim-db`) so it survives cluster rebuilds. Push store + namespace
# label bws-push.home.arpa/allowed=true already present on `lucidmate`.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: nominatim-db
spec:
  # IfNotExists, NOT the Replace default: the upstream Password generator
  # regenerates a fresh value on every refresh, and Replace pushed that new
  # value into Bitwarden hourly. Both consumer ExternalSecrets then pulled a
  # rotated password while CNPG's managed-role reconciliation lagged minutes
  # behind -- a permanent catch-up race that broke auth in every lag window
  # (2026-11-07 incident: bootstrap DROP nearly destroyed a populated DB,
  # initContainers looped forever). The generator only needs to SEED the
  # Bitwarden key once on a fresh store; after that the key is the pin.
  updatePolicy: IfNotExists
  refreshInterval: 5m
  secretStoreRefs:
    - name: bitwarden-secrets-manager-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: nominatim-db-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: nominatim-db
