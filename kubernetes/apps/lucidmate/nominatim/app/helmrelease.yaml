# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nominatim
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts

  dependsOn: []
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    serviceAccount:
      app:
        enabled: true
      replication:
        enabled: true
    rbac:
      roles:
        replication:
          type: Role
          rules:
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create"]
      bindings:
        replication:
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            identifier: replication
          subjects:
            - identifier: replication
    controllers:
      nominatim:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: app
        initContainers:
          wait-for-schema:
            image:
              repository: mediagis/nominatim
              # renovate: datasource=docker depName=mediagis/nominatim
              tag: "5.3.3"
            command: ["/bin/bash", "/scripts/wait-for-schema.sh"]
            envFrom:
              - secretRef:
                  name: nominatim-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        containers:
          nominatim:
            image:
              repository: mediagis/nominatim
              # renovate: datasource=docker depName=mediagis/nominatim
              tag: "5.3.3"
            command: ["/bin/bash", "/scripts/start-external.sh"]
            env:
              # Geofabrik region paths (newline, space, or comma separated).
              # Eastern seaboard (NJ -> ME -> FL corridor), ~3.9 GiB of PBF
              # total. Geofabrik has no new-england aggregate — the six NE
              # states are listed individually.
              NOMINATIM_REGIONS: |-
                north-america/us/maine
                north-america/us/new-hampshire
                north-america/us/vermont
                north-america/us/massachusetts
                north-america/us/rhode-island
                north-america/us/connecticut
                north-america/us/new-york
                north-america/us/new-jersey
                north-america/us/pennsylvania
                north-america/us/delaware
                north-america/us/district-of-columbia
                north-america/us/maryland
                north-america/us/virginia
                north-america/us/north-carolina
                north-america/us/south-carolina
                north-america/us/georgia
                north-america/us/florida
              NOMINATIM_DOWNURL: "https://download.geofabrik.de"
              # Disable the image's built-in replication loop; updates are managed by CronJob.
              UPDATE_MODE: "none"
              REPLICATION_URL: ""
              IMPORT_STYLE: extratags
              IMPORT_WIKIPEDIA: "true"
              IMPORT_SECONDARY_WIKIPEDIA: "true"
              IMPORT_US_POSTCODES: "true"
              PROJECT_DIR: /nominatim
              # No flatnode file: extracts this small (~4 GiB of PBF) keep the
              # osm2pgsql middle index in RAM; flatnode files for US extracts
              # are ~80-90 GiB regardless of state count and would pin the pod
              # to a single node via a node-local PV.
              # In-cluster DB traffic is already plaintext; skip SSL/GSS negotiation
              # so pg_isready and the worker pool stop logging "could not accept SSL
              # connection: EOF" on the shared CNPG cluster.
              PGSSLMODE: disable
              PGGSSENCMODE: disable
              GUNICORN_WORKERS: "4"
              NOMINATIM_API_POOL_SIZE: "5"
              # Daily cron only applies incremental OSC updates; full region PBF imports are opt-in.
              NOMINATIM_ALLOW_REGION_IMPORT: "false"
              NOMINATIM_IMPORT_MAX_REGIONS: "1"
            envFrom:
              - secretRef:
                  name: nominatim-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  # ~60m for refresh + Gunicorn before /status answers.
                  # Measure once after cutover and lower if it's consistently faster.
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
      ui:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: app
        initContainers:
          ui-init:
            image:
              repository: docker.io/library/alpine
              # renovate: datasource=docker depName=library/alpine
              tag: 3.24.4
            command: ["/bin/sh", "/scripts/init-ui.sh"]
            env:
              # renovate: datasource=github-releases depName=osm-search/nominatim-ui
              NOMINATIM_UI_VERSION: "3.12.0"
        containers:
          ui:
            image:
              repository: docker.io/library/nginx
              # renovate: datasource=docker depName=library/nginx
              tag: 1.31.3-alpine
            probes:
              liveness: &uiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /search.html
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *uiProbe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
      update-osm-db:
        type: cronjob
        cronjob:
          # Re-enable (suspend: false) after CNPG soak + first successful backup.
          suspend: true
          schedule: "@daily"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          # Kill stuck kubectl exec sessions (e.g. multi-day add-data) after 12h.
          activeDeadlineSeconds: 43200
          ttlSecondsAfterFinished: 86400
          backoffLimit: 0
        containers:
          kubectl:
            image:
              repository: registry.k8s.io/kubectl
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              tag: v1.37.2
            args:
              - exec
              - deploy/nominatim
              - -c
              - nominatim
              - --
              - /bin/bash
              - /scripts/maintain-regions.sh
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
        serviceAccount:
          identifier: replication

      # Self-guarding fresh-cluster bootstrap: checks placex, exits 0 when
      # data exists; otherwise drops the empty initdb DB and imports the seed
      # region. Fires on apply; on a cluster redeploy it re-imports without
      # manual intervention. Prerequisites come from the CNPG cluster's
      # postInit* hooks (see clusters/nominatim/postgres.yaml).
      bootstrap:
        type: job
        job:
          backoffLimit: 3
          ttlSecondsAfterFinished: 86400
        pod:
          restartPolicy: Never
        serviceAccount:
          identifier: app
        containers:
          bootstrap:
            image:
              repository: mediagis/nominatim
              # renovate: datasource=docker depName=mediagis/nominatim
              tag: "5.3.3"
            command: ["/bin/bash", "/scripts/bootstrap.sh"]
            env:
              NOMINATIM_BOOTSTRAP_REGION: north-america/us/new-jersey
              NOMINATIM_DOWNURL: "https://download.geofabrik.de"
              NOMINATIM_IMPORT_THREADS: "8"
              IMPORT_STYLE: extratags
              PGSSLMODE: disable
              PGGSSENCMODE: disable
            envFrom:
              - secretRef:
                  name: nominatim-secret
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 6Gi

    service:
      nominatim:
        controller: nominatim
        forceRename: nominatim
        ports:
          http:
            port: 80
            targetPort: 8080
      ui:
        controller: ui
        forceRename: nominatim-ui
        ports:
          http:
            port: 80

    persistence:
      project:
        # Created by components/moosefs (claim name = ${APP} = nominatim).
        existingClaim: nominatim
        advancedMounts:
          nominatim:
            nominatim:
              - path: /nominatim
          bootstrap:
            bootstrap:
              - path: /nominatim
      scripts:
        type: configMap
        name: nominatim-scripts
        defaultMode: 0755
        advancedMounts:
          nominatim:
            wait-for-schema:
              - path: /scripts
            nominatim:
              - path: /scripts
          bootstrap:
            bootstrap:
              - path: /scripts
          ui:
            ui-init:
              - path: /scripts
      ui-www:
        type: emptyDir
        advancedMounts:
          ui:
            ui-init:
              - path: /ui-www
            ui:
              - path: /ui-www
                readOnly: true
      ui-nginx:
        type: configMap
        name: nominatim-nginx
        advancedMounts:
          ui:
            ui:
              - path: /etc/nginx/conf.d
                readOnly: true
      import-staging:
        type: emptyDir
        advancedMounts:
          nominatim:
            nominatim:
              - path: /import-staging
          bootstrap:
            bootstrap:
              - path: /import-staging
      dev-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        advancedMounts:
          nominatim:
            nominatim:
              - path: /dev/shm
          bootstrap:
            bootstrap:
              - path: /dev/shm

    route:
      nominatim:
        hostnames: ["nominatim.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          # Static UI assets under /ui
          - matches:
              - path:
                  type: PathPrefix
                  value: /ui
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - name: nominatim-ui
                port: 80
          # Landing page -> UI
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/search.html
                  statusCode: 302
          # API: /search with explicit non-HTML formats
          - matches:
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: json
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: jsonv2
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: xml
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: geojson
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: geocodejson
              - path:
                  type: PathPrefix
                  value: /search
                queryParams:
                  - type: Exact
                    name: format
                    value: debug
            backendRefs:
              - name: nominatim
                port: 80
          # UI: /search without explicit API format
          - matches:
              - path:
                  type: PathPrefix
                  value: /search
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/search.html
                  statusCode: 302
          # UI: html format on other endpoints
          - matches:
              - path:
                  type: PathPrefix
                  value: /reverse
                queryParams:
                  - type: Exact
                    name: format
                    value: html
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/reverse.html
                  statusCode: 302
          - matches:
              - path:
                  type: PathPrefix
                  value: /status
                queryParams:
                  - type: Exact
                    name: format
                    value: html
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/status.html
                  statusCode: 302
          - matches:
              - path:
                  type: PathPrefix
                  value: /details
                queryParams:
                  - type: Exact
                    name: format
                    value: html
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/details.html
                  statusCode: 302
          # API catch-all
          - backendRefs:
              - name: nominatim
                port: 80
