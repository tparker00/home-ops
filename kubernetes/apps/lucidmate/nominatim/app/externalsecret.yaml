---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name nominatim-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        NOMINATIM_PASSWORD: "{{ .NOMINATIM_PASSWORD }}"
        NOMINATIM_DATABASE_DSN: "pgsql:dbname=nominatim;host=postgres-rw.database.svc.cluster.local;user=nominatim;password={{ .NOMINATIM_PASSWORD }}"
        PGHOST: postgres-rw.database.svc.cluster.local
        PGDATABASE: nominatim
        PGUSER: nominatim
        PGPASSWORD: "{{ .NOMINATIM_PASSWORD }}"
  dataFrom:
    - extract:
        key: nominatim
