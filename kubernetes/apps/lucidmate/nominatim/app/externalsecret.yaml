---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name nominatim-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  refreshInterval: 15m
  target:
    name: *name
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        NOMINATIM_PASSWORD: "{{ .password }}"
        # NOTE: host points at the shared CNPG cluster; the PostGIS decision
        # (dedicated nominatim cluster) will retarget this + PGHOST before merge.
        NOMINATIM_DATABASE_DSN: "pgsql:dbname=nominatim;host=postgres-rw.database.svc.cluster.local;user=nominatim;password={{ .password }}"
        PGHOST: postgres-rw.database.svc.cluster.local
        PGDATABASE: nominatim
        PGUSER: nominatim
        PGPASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: nominatim-db
