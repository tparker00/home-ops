---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pocket-id
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: pocket-id-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # App: token-signing key (openssl rand -base64 32, stored once)
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        # Database on the shared CNPG cluster
        DB_CONNECTION_STRING: "postgres://{{ .pg_user }}:{{ .pg_pass }}@postgres-rw.database.svc.cluster.local/pocket-id"
        # Postgres Init (db-init job)
        INIT_POSTGRES_DBNAME: pocket-id
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .super_pg_pass }}"
  dataFrom:
    - extract:
        key: pocket-id
    - extract:
        key: cloudnative-pg
