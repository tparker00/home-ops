---
# Provisions the pocket-id database + role on the shared CNPG cluster
# using the house postgres-init image. Runs before/concurrently with the
# instance; the instance restarts until the database exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: pocket-id-db-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:19.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
          envFrom:
            - secretRef:
                name: pocket-id-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
