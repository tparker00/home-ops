---
# The PocketID instance, managed declaratively by the operator. OIDC
# clients are PocketIDOIDCClient CRs colocated with their consuming apps.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  appUrl: "https://id.${SECRET_DOMAIN}"

  # Token-signing key material; losing it invalidates all sessions.
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: ENCRYPTION_KEY

  # Postgres on the shared CNPG cluster (SQLite is unsuitable for
  # networked storage); database provisioned by db-init.yaml.
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: DB_CONNECTION_STRING

  persistence:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]

  # MooseFS write enforcement honors owner bits only (group bits are
  # ignored for non-owner processes — under investigation upstream, see
  # moosefs-csi PR #20/#17). Run the container as the volume owner:
  # the one-time manual `chown 1000:1000` on the PVC makes owner-write
  # work. fsGroup kept for when upstream fixes group enforcement.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always

  route:
    enabled: true
    annotations:
      external-dns.kubernetes.io/target: "sso.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - "id.${SECRET_DOMAIN}"

  ui:
    appName: PocketID
    sessionDuration: 43800 # 30 days

  userManagement:
    allowUserSignups: "disabled"

  metrics:
    enabled: true

  logging:
    level: "info"
    json: true

  versionCheckDisabled: true
  timezone: "${TIMEZONE}"
