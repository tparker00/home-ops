---
# The PocketID instance, managed declaratively by the operator. OIDC
# clients are PocketIDOIDCClient CRs colocated with their consuming apps.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  appUrl: "https://id.${SECRET_DOMAIN}"

  # Token-signing key material; losing it invalidates all sessions.
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: ENCRYPTION_KEY

  # Postgres on the shared CNPG cluster (SQLite is unsuitable for
  # networked storage); database provisioned by db-init.yaml.
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: DB_CONNECTION_STRING

  # MooseFS CSI volumes come up root-owned and do not honor fsGroup
  # chown; local hostpath matches how the postgres/immich volumes run.
  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: 1Gi
    accessModes: ["ReadWriteOnce"]

  # The operator runs the container as 65534; fsGroup makes the
  # provisioned volume group-writable for the uploads dir.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: Always

  route:
    enabled: true
    annotations:
      external-dns.kubernetes.io/target: "sso.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - "id.${SECRET_DOMAIN}"

  ui:
    appName: PocketID
    sessionDuration: 43800 # 30 days

  userManagement:
    allowUserSignups: "disabled"

  metrics:
    enabled: true

  logging:
    level: "info"
    json: true

  versionCheckDisabled: true
  timezone: "${TIMEZONE}"
