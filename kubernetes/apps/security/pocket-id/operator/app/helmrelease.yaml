---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The PocketID instance itself is managed declaratively below
    # (instance.yaml), not through the chart's embedded instance.
    instance:
      enabled: false
