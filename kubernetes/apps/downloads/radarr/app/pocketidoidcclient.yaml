---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr
spec:
  name: Radarr
  callbackUrls:
    - "https://radarr.${SECRET_DOMAIN}/signin-oidc"
  clientID: radarr
  launchUrl: "https://radarr.${SECRET_DOMAIN}/"
  logo:
    autoGenerate: false
  logoutCallbackUrls:
    - "https://radarr.${SECRET_DOMAIN}/signout-callback-oidc"
  pkceEnabled: true
  secret:
    storeClientSecret: true
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
