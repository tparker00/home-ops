---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts

  dependsOn: []
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
          prometheus.io/scrape: "true"
          prometheus.io/port: "monitoring"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: sonarr-secret
              - secretRef:
                  name: sonarr-oidc-credentials
        containers:
          main:
            nameOverride: *app
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2941@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574
            env:
              TZ: ${TIMEZONE}
              SONARR__AUTH__METHOD: Oidc
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__AUTH__OIDCAUTHORITY: https://id.${SECRET_DOMAIN}
              SONARR__AUTH__OIDCCLIENTID: sonarr
              SONARR__AUTH__OIDCSCOPES: openid email profile
              SONARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    key: OIDC_CLIENT_SECRET
                    name: sonarr-oidc-credentials
              SONARR__INSTANCE_NAME: Sonarr
              SONARR__SERVER__ALLOWEDHOSTS: "*"
              SONARR__SERVER__TRUSTEDNETWORKS: 10.0.0.0/8
            envFrom: *envFrom
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1.5Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: *app
        primary: true
        ports:
          http:
            port: 8989
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
      analogpuddle:
        hostnames: ["{{ .Release.Name }}.analogpuddle.com"]
        parentRefs:
          - name: envoy-internal-ap
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: *app
      data:
        enabled: true
        existingClaim: downloads-rw
        globalMounts:
          - path: /data
