# Lefthook pre-commit hooks.
# Formatting via oxfmt (YAML/JSON/Markdown) + just/mise formatting + kubeconform.

[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-just]
glob = ["*.just", "justfile", "just/**/*.just"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt; done'
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.mise-lock]
glob = [".mise.toml", ".mise/config.toml"]
run = 'mise lock'

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.kubeconform]
glob = ["kubernetes/**/*.yaml", "kubernetes/**/*.yml"]
run = "just kube kubeconform"
