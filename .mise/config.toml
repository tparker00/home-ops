#shellcheck shell=bash
# Managed toolchain + environment (replaces .envrc + .taskfiles/Workstation).
# Activate with: mise install   (then `just` is on PATH via the shim).

[env]
KUBECONFIG = "{{ config_root }}/kubeconfig"
SOPS_CONFIG = "{{ config_root }}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{ config_root }}/age.key"
TALOSCONFIG = "{{ config_root }}/kubernetes/bootstrap/talos/clusterconfig/talosconfig"
VIRTUAL_ENV = "{{ config_root }}/.venv"
PYTHONDONTWRITEBYTECODE = "1"
JUST_UNSTABLE = "1"
_.path = [
    "{{ config_root }}/.venv/bin",
    "{{ config_root }}/.bin",
]

[tools]
uv = "0.12.2"
age = "1.3.1"
cloudflared = "2026.8.2"
flux2 = "2.8.6"
helm = "4.2.3"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.36.3"
kustomize = "5.8.1"
lefthook = "2.1.10"
oxfmt = "0.60.0"
sops = "3.13.3"
talhelper = "3.1.13"
talosctl = "1.13.7"
yq = "4.53.3"
